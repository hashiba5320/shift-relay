<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>シフト</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-512.png">
<meta name="apple-mobile-web-app-title" content="シフト">
<style>
  html, body { margin: 0; height: 100%; background: #ffffff; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  .msg { font-family: sans-serif; padding: 24px; line-height: 1.7; }
</style>
</head>
<body>
<script>
  // ▼ ここだけ、自分のウェブアプリのURL（/exec で終わるもの）に書き換える
  var GAS_URL = 'https://script.google.com/macros/s/AKfycbzpRdePUifH6ICxFf94adkYf8FsP2HPqbjbibGlCgQNwermmKOV7o675xfjt56qs5Jh/exec';

  var t = new URLSearchParams(location.search).get('t') || '';
  if (!t) {
    document.body.innerHTML = '<p class="msg">URLが正しくありません。<br>店長から届いた、あなた専用のURLを開いてください。</p>';
  } else {
    var f = document.createElement('iframe');
    f.src = GAS_URL + '?t=' + encodeURIComponent(t);
    f.title = 'シフト';
    document.body.appendChild(f);
  }
</script>
</body>
</html>
